<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Catalog (INR)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: #1a252f; color: white; padding: 1.5rem; text-align: center; }
        .container { display: flex; max-width: 1200px; margin: 2rem auto; gap: 2rem; padding: 0 1rem; }
        .sidebar { width: 250px; background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .sidebar h3 { margin-bottom: 1rem; font-size: 1.1rem; }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 0.5rem; }
        .filter-group input, .filter-group select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        .catalog { flex: 1; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); display: grid; gap: 1.5rem; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding-bottom: 1rem; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        .product-card h4 { margin: 0.8rem 0 0.3rem 0; font-size: 1rem; }
        .product-card .cat { font-size: 0.8rem; color: #777; margin-bottom: 0.5rem; }
        .product-card .price { font-size: 1.1rem; color: #27ae60; font-weight: bold; }
        .product-card .stock { font-size: 0.8rem; margin-top: 0.3rem; }
        .in-stock { color: #27ae60; }
        .low-stock { color: #e67e22; }
    </style>
</head>
<body>

    <header>
        <h1>Product Catalog & Inventory</h1>
    </header>

    <div class="container">
        <!-- Filter Controls -->
        <div class="sidebar">
            <h3>Filter Inventory</h3>
            
            <div class="filter-group">
                <label for="searchInput">Search Product</label>
                <input type="text" id="searchInput" placeholder="e.g. Shoes...">
            </div>

            <div class="filter-group">
                <label for="categorySelect">Category</label>
                <select id="categorySelect">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="priceInput">Max Price (₹<span id="priceVal">10000</span>)</label>
                <input type="range" id="priceInput" min="0" max="10000" step="100" value="10000">
            </div>
        </div>

        <!-- Catalog Items -->
        <div class="catalog" id="productGrid">
            <!-- Products load dynamically -->
        </div>
    </div>

    <script>
        const API_BASE = '';

        async function loadCategories() {
            const res = await fetch(`${API_BASE}/api/categories`);
            const categories = await res.json();
            const select = document.getElementById('categorySelect');
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                select.appendChild(opt);
            });
        }

        async function fetchProducts() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categorySelect').value;
            const maxPrice = document.getElementById('priceInput').value;

            const url = `${API_BASE}/api/products?search=${encodeURIComponent(search)}&category=${category}&max_price=${maxPrice}`;
            const res = await fetch(url);
            const products = await res.json();

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if(products.length === 0) {
                grid.innerHTML = '<p>No products found matching your criteria.</p>';
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" alt="${p.title}">
                    <h4>${p.title}</h4>
                    <div class="cat">${p.category}</div>
                    <div class="price">₹${p.price.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</div>
                    <div class="stock ${p.stock < 10 ? 'low-stock' : 'in-stock'}">
                        Stock: ${p.stock} units
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', fetchProducts);
        document.getElementById('categorySelect').addEventListener('change', fetchProducts);
        document.getElementById('priceInput').addEventListener('input', (e) => {
            document.getElementById('priceVal').textContent = e.target.value;
            fetchProducts();
        });

        // Initialize
        loadCategories();
        fetchProducts();
    </script>
</body>
</html>
